<!doctype html>

  <head>
    <script>
      // In AI Studio / Cloud Run proxy, HMR WebSockets on custom ports are disabled by design.
      // Provide a clean mock socket for 'vite-hmr' so @vite/client initializes without throwing uncaught errors.
      (function() {
        if (typeof window === 'undefined') return;
        var RealWebSocket = window.WebSocket;
        if (!RealWebSocket) return;
        function PatchedWebSocket(url, protocols) {
          var isViteHmr = protocols === 'vite-hmr' || 
            (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
            (typeof url === 'string' && (url.indexOf(':24678') !== -1 || url.indexOf('token=') !== -1));
          if (isViteHmr) {
            var listeners = {};
            return {
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              readyState: 1,
              bufferedAmount: 0,
              extensions: '',
              protocol: 'vite-hmr',
              url: String(url),
              binaryType: 'blob',
              send: function() {},
              close: function() {},
              addEventListener: function(event, fn) {
                listeners[event] = listeners[event] || [];
                listeners[event].push(fn);
              },
              removeEventListener: function(event, fn) {
                if (!listeners[event]) return;
                listeners[event] = listeners[event].filter(function(cb) { return cb !== fn; });
              },
              dispatchEvent: function() { return true; }
            };
          }
          return new RealWebSocket(url, protocols);
        }
        PatchedWebSocket.prototype = RealWebSocket.prototype;
        PatchedWebSocket.CONNECTING = 0;
        PatchedWebSocket.OPEN = 1;
        PatchedWebSocket.CLOSING = 2;
        PatchedWebSocket.CLOSED = 3;
        window.WebSocket = PatchedWebSocket;

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (
            (event.reason.message && event.reason.message.indexOf('WebSocket closed without opened') !== -1) ||
            (event.reason.stack && event.reason.stack.indexOf('@vite/client') !== -1)
          )) {
            event.preventDefault();
          }
        });
      })();
    </script>
