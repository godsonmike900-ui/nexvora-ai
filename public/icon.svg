<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d172e" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1e293b" stroke-width="4" stroke-opacity="0.6" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow)" />

  <!-- Monogram N with modern tech diagonals -->
  <g filter="url(#glow)">
    <!-- Left vertical bar -->
    <path d="M 140 136 L 196 136 L 196 376 L 140 376 Z" fill="url(#neonCyan)" rx="10" />
    <!-- Diagonal bar -->
    <path d="M 180 136 L 236 136 L 332 376 L 276 376 Z" fill="url(#neonCyan)" rx="10" />
    <!-- Right vertical bar -->
    <path d="M 316 136 L 372 136 L 372 376 L 316 376 Z" fill="url(#neonCyan)" rx="10" />
  </g>

  <!-- Futuristic node accents -->
  <circle cx="168" cy="136" r="14" fill="#38bdf8" />
  <circle cx="344" cy="376" r="14" fill="#06b6d4" />
  <circle cx="344" cy="136" r="10" fill="#60a5fa" />
  <circle cx="168" cy="376" r="10" fill="#3b82f6" />
</svg>
